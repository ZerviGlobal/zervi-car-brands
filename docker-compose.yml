services:
  zervi-car-brands:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: zervi-car-brands:latest
    container_name: zervi-car-brands
    restart: unless-stopped
    # Host port 3085 (Tailscale) -> container 3000. Hardcoded so Coolify
    # parses the exact mapping from the compose file.
    ports:
      - "3085:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    # Healthcheck is managed via Coolify app settings (health_check_* fields),
    # not in the compose file, to avoid YAML quote-escaping issues with the
    # node-based HTTP probe (the slim runner image has no wget/curl).
