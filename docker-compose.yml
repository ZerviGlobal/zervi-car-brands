services:
  zervi-car-brands:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: zervi-car-brands:latest
    container_name: zervi-car-brands
    restart: unless-stopped
    # Host port 3085 (Tailscale) -> container 3000. Hardcoded so Coolify
    # parses the exact mapping from the compose file.
    ports:
      - "3085:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    healthcheck:
      # Node 24 slim image has no wget/curl, so use node for the HTTP probe.
      test: ["CMD-SHELL", "node -e "const h=require('http');h.get('http://localhost:3000/',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
