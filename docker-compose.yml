services:
  zervi-car-brands:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: zervi-car-brands:latest
    container_name: zervi-car-brands
    restart: unless-stopped
    # Coolify injects PORT (defaults to 3000 here if unset). The app's
    # Dockerfile sets ENV PORT=3000 and EXPOSE 3000, so we map to it.
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
