services:
  zervi-car-brands:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: zervi-car-brands:latest
    container_name: zervi-car-brands
    restart: unless-stopped
    # Host port 3085 (Tailscale) -> container 3000. Hardcoded so Coolify
    # parses the exact mapping from the compose file.
    ports:
      - "3085:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
